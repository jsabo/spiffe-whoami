# Build the image, then deploy it to each Kubernetes cluster through Teleport.
#
# The deploy job holds no kubeconfig and no cloud credential. It joins Teleport
# with GitHub's own OIDC token (join method `github`), pinned to this repository
# and branch, receives a one-hour certificate for the bot `spiffe-whoami-deploy`,
# and reaches each cluster through the Teleport proxy and the cluster's own agent.
# The runner has no network path to any cluster. Every kubectl call is a
# kube.request audit event attributed to the bot.
#
# Everything specific to one Teleport tenant comes from repository variables
# (Settings → Secrets and variables → Actions → Variables), so this file and the
# instance files stay generic:
#   TELEPORT_PROXY   e.g. example.teleport.sh:443
#   KUBE_CLUSTERS    JSON list of Teleport Kubernetes cluster names, e.g. ["k8s-prod"]
#   AWS_ROLE_ARN     optional; the role from aws/main.tf, applied to instances that
#   AWS_SECRET_ID    opt in (payments/processor and analytics/processor)
#   AWS_REGION       optional, default us-east-2
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write        # GitHub mints the OIDC token tbot joins with
    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(vars.KUBE_CLUSTERS) }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: Install Teleport (version follows the cluster)
        uses: teleport-actions/setup@v1
        with:
          version: auto
          proxy: ${{ vars.TELEPORT_PROXY }}
      - name: Join Teleport as bot spiffe-whoami-deploy and get a kubeconfig
        uses: teleport-actions/auth-k8s@v2
        with:
          proxy: ${{ vars.TELEPORT_PROXY }}
          token: spiffe-whoami-deploy
          kubernetes-cluster: ${{ matrix.cluster }}
          certificate-ttl: 1h
      - name: Deploy the three instances
        env:
          IMAGE: ${{ env.IMAGE }}:${{ needs.test-and-build.outputs.tag }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_SECRET_ID: ${{ vars.AWS_SECRET_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          for inst in deploy/instances/example/*.env; do
            echo "==> $inst"
            deploy/render.sh "$inst" | kubectl apply -f -
          done
      - name: Wait for rollouts (Ready means an SVID was issued)
        run: |
          set -euo pipefail
          for inst in deploy/instances/example/*.env; do
            # shellcheck disable=SC1090
            . "$inst"
            kubectl -n "$NAMESPACE" rollout status "deploy/$NAME" --timeout=180s
          done
      # The bot's role covers two namespaces, so a cluster-wide list is refused —
      # which is the point. List each namespace it may see.
      - name: Show what got deployed, as the bot sees it
        run: |
          for ns in payments analytics; do
            kubectl -n "$ns" get pods -l app.kubernetes.io/name=spiffe-whoami -o wide
          done
